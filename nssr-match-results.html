<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NSSR Previous Match Results</title>

  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: transparent;
      font-family: Inter, system-ui, sans-serif;
      display: flex; justify-content: center; align-items: center;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    .card {
      position: relative;
      flex-shrink: 0;
      width: 1720px;
      background: rgba(15, 23, 42, 1);
      border-radius: 24px;
      padding: 48px 50px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      transition: height 0.4s ease;
      color: #e9eef8;
      box-shadow: 0 32px 32px rgba(0,0,0,0.65);
      box-sizing: border-box;
    }

    .title {
      font-size: 56px;
      color: #c7d7ff;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .035em;
      margin-bottom: 24px;
      text-align: center;
    }

    /* TEMP: removed Rank Delta column */
    .header-row,
    .entry {
      display: grid;
      grid-template-columns: 150px 1fr 200px 130px 180px; /* Place | Player | Elo | +/- | Rank */
      align-items: center;
    }

    .header-row {
      height: 60px;
      margin-bottom: 14px;
      background: rgba(148, 163, 184, 0.12);
      font-size: 24px;
      font-weight: 700;
      text-transform: uppercase;
      color: #9ca3c7;
      border-radius: 12px;
      text-align: center;
    }

    .header-row span:nth-child(2) {
      text-align: left;
      padding-left: 36px;
    }

    .header-row > span {
      border-right: 2px solid rgba(255,255,255,0);
    }

    .header-row > span:last-child {
      border-right: none;
    }

    #resultsList {
      display: flex;
      flex-direction: column;
      gap: 10px;
      opacity: 1;
      transition: opacity .3s ease;
    }

    .entry {
      height: 70px;
      background: rgba(255,255,255,0.07);
      border-radius: 14px;
      font-size: 42px;
      font-weight: 600;
      color: #fff;
      align-items: center;
      transition: background .3s ease, box-shadow .3s ease;
    }

    .place {
      font-size: 42px;
      font-weight: 900;
      text-align: center;
      line-height: 1;
      color: #c7d7ff;
    }

    .player-name {
      font-size: 36px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: left;
      padding-left: 36px;
      padding-right: 36px;
    }

    .elo-value, .rank-value {
      font-size: 42px;
      font-weight: 900;
      text-align: center;
      line-height: 1;
    }

    .elo-delta {
      font-size: 36px;
      text-align: center;
      position: relative;
      animation: pulseDelta 1.8s ease-in-out infinite;
    }

    .delta-arrow {
      margin-right: 4px;
      font-size: 0.6em;
      vertical-align: middle;
      position: relative;
      top: -0.2em;
    }

    .gold { color: #ffd700; }
    .silver { color: #c0c0c0; }
    .bronze { color: #cd7f32; }

    .delta-positive { color: #4ade80; }
    .delta-negative { color: #f87171; }

    .entry > span {
      border-right: 2px solid rgba(255,255,255,0.14);
      right: -1px;
      height: 45px;
      position: relative;
      vertical-align: middle;
    }

    .entry > span:last-child {
      border-right: none;
    }

    .entry.highlight-gold {
      background: rgba(255, 215, 0, 0.28);
      box-shadow: 0 0 18px rgba(255, 215, 0, 0.3);
    }

    .entry.highlight-silver {
      background: rgba(192, 192, 192, 0.28);
      box-shadow: 0 0 18px rgba(192, 192, 192, 0.3);
    }

    .entry.highlight-bronze {
      background: rgba(205, 127, 50, 0.28);
      box-shadow: 0 0 18px rgba(205, 127, 50, 0.3);
    }

    .entry.highlight-default {
      background: rgba(52, 211, 153, 0.30);
      box-shadow: 0 0 18px rgba(16, 185, 129, 0.3);
    }

    .loading, .error {
      font-size: 36px;
      width: 100%;
      text-align: center;
    }

    .status { position: absolute; bottom: 12px; left: 20px; right: 20px; text-align: center; color: #facc15; font-size: 16px; }

    @keyframes pulseDelta {
      0%, 100% { transform: scale(1); opacity: 1; }
      50%      { transform: scale(1); opacity: 0.7; }
    }
  </style>
  <link rel="stylesheet" href="nssr-theme.css" />
</head>

<body>
<div class="card" id="card">
  <div class="title">Previous Match Results</div>

  <div class="header-row">
    <span>Place</span>
    <span>Player</span>
    <span>Elo</span>
    <span>+/-</span>
    <span>Rank</span>
  </div>

  <div id="resultsList">
    <div class="loading">Loading…</div>
  </div>
  <div id="status" class="status" role="status"></div>
</div>

<script src="nssr-config.js"></script>
<script src="nssr-api.js"></script>
<script src="nssr-match-results.js"></script>
</body>
</html>
