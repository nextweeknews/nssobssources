<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Golf Scoreboard</title>

<style>
:root {
  --surface: rgba(15, 23, 42, 0.98);
  --panel: rgba(255, 255, 255, 0.065);
  --panel-strong: rgba(148, 163, 184, 0.13);
  --line: rgba(255, 255, 255, 0.12);
  --text: #f8fafc;
  --muted: #9ca3c7;
  --label: #c7d7ff;
  --par: #ffffff;
  --albatross: #d8b4fe;
  --eagle: #93c5fd;
  --birdie: #86efac;
  --teal: #5eead4;
  --bogey: #fca5a5;
  --double-bogey: #fb7185;
  --worse: #f43f5e;
}

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  background: transparent;
  color: var(--text);
  font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.card {
  width: 1800px;
  height: 178px;
  padding: 0 24px;
  background: transparent;
  display: grid;
  grid-template-columns: 178px 1fr;
  column-gap: 14px;
  align-items: center;
}

.challenge-title {
  width: 178px;
  height: 138px;
  background: rgba(15, 23, 42, 0.94);
  border-radius: 12px;
  box-shadow: inset 0 0 0 1px rgba(199,215,255,0.11);
  color: #dbe7ff;
  display: grid;
  grid-template-rows: 32px 70px 22px;
  row-gap: 5px;
  align-content: center;
  align-items: center;
  justify-content: center;
  text-align: center;
  text-transform: uppercase;
  font-weight: 950;
  font-variant-numeric: tabular-nums;
}

.challenge-break {
  line-height: 1;
  font-size: 38px;
  letter-spacing: 0.045em;
}

.challenge-number {
  line-height: 1;
  font-size: 82px;
  letter-spacing: 0;
}

.challenge-word {
  line-height: 1;
  font-size: 19px;
  letter-spacing: 0.15em;
}

.scoreboard {
  display: grid;
  grid-template-columns: 1fr 1fr 116px;
  column-gap: 0;
  height: 138px;
}

.round-group {
  margin-left: 10px;
  grid-template-columns: 1fr;
  background: rgba(18, 31, 55, 0.96);
}

.column-group {
  min-width: 0;
  overflow: hidden;
  border-radius: 12px;
  background: rgba(15, 23, 42, 0.94);
  box-shadow: inset 0 0 0 1px rgba(199,215,255,0.11);
  display: grid;
  grid-template-rows: 36px 20px 82px;
}

.holes-group {
  grid-template-columns: repeat(9, minmax(0, 1fr)) 96px;
}

.holes-group:first-child {
  border-top-right-radius: 0;
  border-bottom-right-radius: 0;
}

.holes-group:nth-child(2) {
  border-top-left-radius: 0;
  border-bottom-left-radius: 0;
}

.cell {
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  font-variant-numeric: tabular-nums;
}

.hole-cell {
  background: rgba(42, 57, 89, 0.84);
  color: #dbe7ff;
  font-size: 25px;
  font-weight: 950;
}

.total-head {
  font-size: 19px;
  font-weight: 950;
  letter-spacing: 0.035em;
}

.par-cell {
  background: rgba(29, 41, 66, 0.9);
  color: #b6c1dd;
  font-size: 16px;
  font-weight: 750;
}

.score-cell {
  background: rgba(29, 41, 66, 0.9);
}

.score-cell.filled {
  background: rgba(37, 51, 79, 0.96);
}

.score-cell.changed::after {
  content: "";
  position: absolute;
  inset: 8px 7px;
  z-index: 0;
  border-radius: 999px;
  pointer-events: none;
  opacity: 0;
  filter: blur(3px);
  animation: scoreCellPulse 520ms cubic-bezier(.2, .8, .2, 1) forwards;
}

.score-cell.changed.added::after {
  background:
    radial-gradient(circle at center, rgba(94, 234, 212, 0.18), rgba(94, 234, 212, 0.08) 42%, transparent 72%),
    linear-gradient(180deg, rgba(255,255,255,0.08), transparent 62%);
}

.score-cell.changed.undone::after {
  background:
    radial-gradient(circle at center, rgba(199, 215, 255, 0.16), rgba(199, 215, 255, 0.07) 42%, transparent 72%),
    linear-gradient(180deg, rgba(255,255,255,0.07), transparent 62%);
}

.score-cell.changed .score-mark {
  animation: scoreMarkPulse 560ms cubic-bezier(.2, .8, .2, 1) forwards;
}

.total-cell {
  flex-direction: column;
  gap: 4px;
  background: rgba(39, 54, 84, 0.95);
}

.total-cell.round {
  background: rgba(46, 61, 92, 0.98);
}

.total-raw {
  font-size: 38px;
  font-weight: 950;
  line-height: 0.95;
  color: #ffffff;
}

.relative {
  min-width: 0;
  height: auto;
  padding: 0;
  border-radius: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  font-weight: 900;
  line-height: 1;
  color: var(--teal);
  background: transparent;
}

.relative.empty {
  visibility: hidden;
}

.relative.under {
  color: var(--teal);
}

.relative.even {
  color: var(--teal);
}

.relative.over {
  color: var(--teal);
}

.score-mark {
  width: 58px;
  height: 58px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  position: relative;
  color: var(--par);
  font-size: 38px;
  font-weight: 950;
  line-height: 1;
}

.score-mark.empty {
  color: rgba(255,255,255,0.28);
  font-size: 36px;
}

.score-mark.albatross { color: var(--albatross); }
.score-mark.eagle { color: var(--eagle); }
.score-mark.birdie { color: var(--birdie); }
.score-mark.bogey { color: var(--bogey); }
.score-mark.double-bogey { color: var(--double-bogey); }
.score-mark.worse { color: var(--worse); }

.score-value {
  position: relative;
  z-index: 1;
  transform: translateY(-1px);
}

.ring {
  position: absolute;
  pointer-events: none;
  border: 3px solid currentColor;
  opacity: 0.96;
}

.ring.circle {
  border-radius: 999px;
}

.ring.square {
  border-radius: 7px;
}

.ring-1 { inset: 7px; }
.ring-2 { inset: 1px; }
.ring-3 { inset: -5px; }

@keyframes scoreCellPulse {
  0% { opacity: 0; transform: scale(0.9); }
  30% { opacity: 0.78; transform: scale(1); }
  100% { opacity: 0; transform: scale(1.05); }
}

@keyframes scoreMarkPulse {
  0% { transform: scale(0.96); filter: brightness(1); }
  30% { transform: scale(1.035); filter: brightness(1.1); }
  100% { transform: scale(1); filter: brightness(1); }
}
</style>
</head>

<body>
<main class="card" aria-label="Golf scoreboard">
  <div class="challenge-title" aria-hidden="true">
    <div class="challenge-break">Break</div>
    <div class="challenge-number">40</div>
    <div class="challenge-word">Challenge</div>
  </div>
  <section class="scoreboard" id="scoreboard"></section>
</main>

<script>
const STORAGE_KEY = "nss_golf_scoreboard_round_v1";

const holes = [
  { number: 1, par: 4 },
  { number: 2, par: 3 },
  { number: 3, par: 5 },
  { number: 4, par: 3 },
  { number: 5, par: 5 },
  { number: 6, par: 4 },
  { number: 7, par: 4 },
  { number: 8, par: 3 },
  { number: 9, par: 5 },
  { number: 10, par: 4 },
  { number: 11, par: 3 },
  { number: 12, par: 5 },
  { number: 13, par: 3 },
  { number: 14, par: 5 },
  { number: 15, par: 4 },
  { number: 16, par: 4 },
  { number: 17, par: 3 },
  { number: 18, par: 5 }
];

const scoreActions = {
  "1": { label: "Albatross", delta: -3 },
  "2": { label: "Eagle", delta: -2 },
  "3": { label: "Birdie", delta: -1 },
  "4": { label: "Par", delta: 0 },
  "5": { label: "Bogey", delta: 1 },
  "6": { label: "Double bogey", delta: 2 }
};

const OBS_EVENT_NAME = "nssGolfScoreboard";
const eventActions = {
  albatross: -3,
  doubleeagle: -3,
  double_eagle: -3,
  eagle: -2,
  birdie: -1,
  par: 0,
  bogey: 1,
  double: 2,
  doublebogey: 2,
  double_bogey: 2
};

const scoreboardEl = document.getElementById("scoreboard");

let history = loadHistory();
let lastChange = null;

function loadHistory() {
  try {
    const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    if (!Array.isArray(parsed)) return [];
    return parsed.filter((entry) =>
      Number.isInteger(entry?.holeIndex) &&
      entry.holeIndex >= 0 &&
      entry.holeIndex < holes.length &&
      Number.isInteger(entry?.delta)
    );
  } catch (err) {
    console.warn("Could not load saved golf scoreboard state.", err);
    return [];
  }
}

function saveHistory() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
}

function getScores() {
  const scores = Array(holes.length).fill(null);
  history.forEach((entry) => {
    scores[entry.holeIndex] = entry.delta;
  });
  return scores;
}

function getNextHoleIndex(scores) {
  return scores.findIndex((score) => score === null);
}

function addGroup(className) {
  const group = document.createElement("div");
  group.className = `column-group ${className}`;
  scoreboardEl.appendChild(group);
  return group;
}

function addCell(parent, className, text = "") {
  const cell = document.createElement("div");
  cell.className = `cell ${className}`;
  cell.textContent = text;
  parent.appendChild(cell);
  return cell;
}

function makeScoreMark(delta, par) {
  const mark = document.createElement("div");
  mark.className = "score-mark";

  if (delta === null) {
    mark.classList.add("empty");
    return mark;
  }

  const score = par + delta;
  const ringCount = getRingCount(delta);
  const ringShape = delta < 0 ? "circle" : delta > 0 ? "square" : "";
  const tone = getTone(delta);

  mark.classList.add(tone);
  mark.innerHTML = `<span class="score-value">${score}</span>`;

  for (let i = 1; i <= ringCount; i++) {
    const ring = document.createElement("span");
    ring.className = `ring ${ringShape} ring-${i}`;
    mark.appendChild(ring);
  }

  return mark;
}

function getRingCount(delta) {
  if (delta <= -3) return 3;
  if (delta === -2) return 2;
  if (delta === -1) return 1;
  if (delta === 1) return 1;
  if (delta >= 2) return Math.min(delta, 3);
  return 0;
}

function getTone(delta) {
  if (delta <= -3) return "albatross";
  if (delta === -2) return "eagle";
  if (delta === -1) return "birdie";
  if (delta === 1) return "bogey";
  if (delta === 2) return "double-bogey";
  if (delta > 2) return "worse";
  return "par";
}

function getTotal(scores, start, end) {
  let raw = 0;
  let par = 0;
  let count = 0;

  for (let i = start; i < end; i++) {
    if (scores[i] === null) continue;
    raw += holes[i].par + scores[i];
    par += holes[i].par;
    count++;
  }

  return { raw, relative: raw - par, count };
}

function formatRelative(relative) {
  if (relative === 0) return "E";
  return relative > 0 ? `+${relative}` : String(relative);
}

function relativeClass(relative, count) {
  if (!count) return "empty";
  if (relative < 0) return "under";
  if (relative > 0) return "over";
  return "even";
}

function makeTotalCell(parent, total, extraClass = "") {
  const cell = addCell(parent, `score-cell total-cell ${extraClass}`);
  const raw = document.createElement("div");
  raw.className = "total-raw";
  raw.textContent = total.count ? total.raw : "";

  const relative = document.createElement("div");
  relative.className = `relative ${relativeClass(total.relative, total.count)}`;
  relative.textContent = total.count ? formatRelative(total.relative) : "";

  cell.append(raw, relative);
  return cell;
}

function render() {
  const scores = getScores();
  const frontTotal = getTotal(scores, 0, 9);
  const backTotal = getTotal(scores, 9, 18);
  const roundTotal = getTotal(scores, 0, 18);

  scoreboardEl.innerHTML = "";

  const front = addGroup("holes-group");
  holes.slice(0, 9).forEach((hole) => addCell(front, "hole-cell", hole.number));
  addCell(front, "hole-cell total-head", "FRONT");
  holes.slice(0, 9).forEach((hole) => addCell(front, "par-cell", hole.par));
  addCell(front, "par-cell", holes.slice(0, 9).reduce((sum, hole) => sum + hole.par, 0));
  holes.slice(0, 9).forEach((hole, i) => renderScoreCell(front, hole, i, scores));
  makeTotalCell(front, frontTotal);

  const back = addGroup("holes-group");
  holes.slice(9).forEach((hole) => addCell(back, "hole-cell", hole.number));
  addCell(back, "hole-cell total-head", "BACK");
  holes.slice(9).forEach((hole) => addCell(back, "par-cell", hole.par));
  addCell(back, "par-cell", holes.slice(9).reduce((sum, hole) => sum + hole.par, 0));
  holes.slice(9).forEach((hole, sliceIndex) => {
    const i = sliceIndex + 9;
    renderScoreCell(back, hole, i, scores);
  });
  makeTotalCell(back, backTotal);

  const round = addGroup("round-group");
  addCell(round, "hole-cell total-head", "TOTAL");
  addCell(round, "par-cell", holes.reduce((sum, hole) => sum + hole.par, 0));
  makeTotalCell(round, roundTotal, "round");
}

function renderScoreCell(parent, hole, index, scores) {
  const cell = addCell(parent, "score-cell");
  if (scores[index] !== null) cell.classList.add("filled");
  if (lastChange?.holeIndex === index) {
    cell.classList.add("changed", lastChange.type);
  }
  cell.appendChild(makeScoreMark(scores[index], hole.par));
}

function recordScore(delta) {
  const scores = getScores();
  const nextHoleIndex = getNextHoleIndex(scores);
  if (nextHoleIndex === -1) {
    return;
  }

  history.push({ holeIndex: nextHoleIndex, delta });
  lastChange = { holeIndex: nextHoleIndex, type: "added" };
  saveHistory();
  render();
}

function undoScore() {
  if (!history.length) {
    return;
  }

  const undone = history.pop();
  lastChange = { holeIndex: undone.holeIndex, type: "undone" };
  saveHistory();
  render();
}

function resetScores() {
  history = [];
  lastChange = null;
  saveHistory();
  render();
}

function normalizeEventDetail(event) {
  const detail = event?.detail || {};
  return detail.event_data || detail.eventData || detail;
}

function handleScoreboardCommand(command) {
  const action = String(command?.action || command?.type || "").toLowerCase().replace(/[\s-]/g, "_");

  if (action === "undo") {
    undoScore();
    return;
  }

  if (action === "reset" || action === "clear") {
    resetScores();
    return;
  }

  if (Number.isInteger(command?.delta)) {
    recordScore(command.delta);
    return;
  }

  const normalizedAction = action.replace(/_/g, "");
  if (Object.prototype.hasOwnProperty.call(eventActions, action)) {
    recordScore(eventActions[action]);
    return;
  }
  if (Object.prototype.hasOwnProperty.call(eventActions, normalizedAction)) {
    recordScore(eventActions[normalizedAction]);
  }
}

function isOptionHotkey(event) {
  return event.altKey && !event.metaKey && !event.ctrlKey && !event.shiftKey;
}

function getHotkeyDigit(event) {
  const codeMatch = event.code && event.code.match(/^Digit([1-8])$/);
  if (codeMatch) return codeMatch[1];

  const keyMatch = event.key && event.key.match(/^[1-8]$/);
  return keyMatch ? keyMatch[0] : null;
}

window.addEventListener("keydown", (event) => {
  if (!isOptionHotkey(event)) return;

  const digit = getHotkeyDigit(event);
  const action = scoreActions[digit];
  if (action) {
    event.preventDefault();
    recordScore(action.delta);
    return;
  }

  if (digit === "7") {
    event.preventDefault();
    undoScore();
    return;
  }

  if (digit === "8") {
    event.preventDefault();
    resetScores();
  }
});

window.addEventListener(OBS_EVENT_NAME, (event) => {
  handleScoreboardCommand(normalizeEventDetail(event));
});

render();
</script>
</body>
</html>
